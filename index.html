<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗路五千年</title>
<style>
/* SECTION: reset & variables */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0e14;--bg2:#131620;--card:#1a1d2e;
  --gold:#d4a853;--gold-light:#f0d89a;--gold-dim:rgba(212,168,83,0.15);
  --ink:#e8dcc8;--ink2:#a89b85;--ink3:#6b6155;
  --accent:#c0392b;--accent2:#e74c3c;
  --blue:#4a90a4;--green:#5a8a6a;
  --radius:14px;--shadow:0 4px 24px rgba(0,0,0,0.4);
  --font:'PingFang SC','Noto Serif SC','Microsoft YaHei','Songti SC',serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden}
a{color:var(--gold);text-decoration:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--ink3);border-radius:3px}

/* SECTION: hero */
.hero{
  position:relative;height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  overflow:hidden;
}
.hero-bg{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(212,168,83,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(192,57,43,0.06) 0%, transparent 50%),
    linear-gradient(180deg, #0c0e14 0%, #1a1520 50%, #0c0e14 100%);
}
.hero-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hero-particle{
  position:absolute;border-radius:50%;background:var(--gold);opacity:0.15;
  animation:float 8s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-30px) scale(1.1)}
}
.hero-content{position:relative;z-index:2;max-width:700px;padding:0 20px}
.hero-badge{
  display:inline-block;padding:6px 20px;border:1px solid var(--gold-dim);
  border-radius:20px;font-size:12px;color:var(--gold);letter-spacing:4px;
  margin-bottom:24px;backdrop-filter:blur(10px);
  background:rgba(212,168,83,0.05);
}
.hero-title{
  font-size:clamp(42px,8vw,80px);font-weight:900;
  background:linear-gradient(135deg,#f0d89a 0%,#d4a853 40%,#c0392b 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:6px;line-height:1.2;margin-bottom:16px;
}
.hero-sub{font-size:clamp(14px,2.5vw,18px);color:var(--ink2);letter-spacing:2px;margin-bottom:40px}
.hero-search{
  display:flex;max-width:480px;width:100%;margin:0 auto;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:30px;overflow:hidden;backdrop-filter:blur(10px);
  transition:border-color 0.3s;
}
.hero-search:focus-within{border-color:var(--gold)}
.hero-search input{
  flex:1;padding:14px 24px;background:none;border:none;outline:none;
  color:var(--ink);font-size:15px;font-family:var(--font);
}
.hero-search input::placeholder{color:var(--ink3)}
.hero-search button{
  padding:14px 28px;background:linear-gradient(135deg,var(--gold),#b8923e);
  border:none;color:#fff;font-weight:600;cursor:pointer;font-size:14px;
  transition:opacity 0.2s;
}
.hero-search button:hover{opacity:0.9}
.hero-scroll{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  color:var(--ink3);font-size:12px;letter-spacing:2px;
  animation:bob 2s ease-in-out infinite;cursor:pointer;
}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* SECTION: search results overlay */
.search-overlay{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);
  align-items:flex-start;justify-content:center;padding-top:120px;
}
.search-overlay.show{display:flex}
.search-results{
  background:var(--card);border:1px solid rgba(255,255,255,0.1);
  border-radius:var(--radius);max-width:520px;width:90%;max-height:60vh;
  overflow-y:auto;padding:8px;
}
.search-result-item{
  padding:14px 18px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;gap:14px;transition:background 0.2s;
}
.search-result-item:hover{background:var(--gold-dim)}
.search-result-item .sr-emoji{font-size:24px}
.search-result-item .sr-name{font-weight:600}
.search-result-item .sr-meta{font-size:12px;color:var(--ink2)}
.search-close{
  position:fixed;top:30px;right:30px;width:40px;height:40px;
  border-radius:50%;border:1px solid rgba(255,255,255,0.2);
  background:rgba(0,0,0,0.5);color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* SECTION: timeline */
.timeline-section{
  position:relative;padding:80px 0 120px;
  min-height:100vh;
}
.timeline-section-title{
  text-align:center;font-size:clamp(24px,4vw,36px);font-weight:800;
  color:var(--gold-light);letter-spacing:4px;margin-bottom:60px;
}
.timeline-container{
  position:relative;max-width:1100px;margin:0 auto;padding:0 20px;
}
/* center axis line */
.timeline-axis{
  position:absolute;left:50%;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,transparent,var(--gold) 5%,var(--gold) 95%,transparent);
  transform:translateX(-50%);
}
/* dynasty grid lines every ~200 years */
.dynasty-line{
  position:absolute;left:0;right:0;height:1px;
  background:rgba(212,168,83,0.12);
  transition:background 0.3s;
}
.dynasty-line.highlight{background:rgba(212,168,83,0.5)}
.dynasty-label{
  position:absolute;left:50%;transform:translateX(-50%);
  padding:8px 24px;background:var(--bg);border:1px solid var(--gold-dim);
  border-radius:20px;font-size:13px;font-weight:700;color:var(--gold);
  letter-spacing:3px;white-space:nowrap;z-index:5;
  cursor:pointer;transition:all 0.3s;
}
.dynasty-label:hover,.dynasty-label.highlight{
  background:var(--gold);color:var(--bg);border-color:var(--gold);
  box-shadow:0 0 20px rgba(212,168,83,0.3);
}
.dynasty-years{
  display:block;font-size:10px;font-weight:400;color:var(--ink3);
  letter-spacing:1px;margin-top:2px;
}
.dynasty-label:hover .dynasty-years,.dynasty-label.highlight .dynasty-years{color:var(--bg)}

/* SECTION: poet cards */
.poet-card{
  position:absolute;width:280px;
  background:var(--card);border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);cursor:pointer;
  transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  z-index:3;
}
.poet-card:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 32px rgba(0,0,0,0.5),0 0 0 1px var(--gold-dim);
  border-color:var(--gold-dim);
}
.poet-card.highlight{
  border-color:var(--gold);
  box-shadow:0 8px 32px rgba(212,168,83,0.2),0 0 0 1px var(--gold);
  transform:translateY(-4px);
}
.poet-card.left{right:calc(50% + 40px);text-align:right}
.poet-card.right{left:calc(50% + 40px);text-align:left}
/* connector line from card to axis */
.poet-card.left::after{
  content:'';position:absolute;right:-40px;top:50%;
  width:40px;height:1px;background:rgba(212,168,83,0.3);
}
.poet-card.right::after{
  content:'';position:absolute;left:-40px;top:50%;
  width:40px;height:1px;background:rgba(212,168,83,0.3);
}
/* dot on axis */
.poet-dot{
  position:absolute;left:50%;width:12px;height:12px;
  background:var(--gold);border:2px solid var(--bg);
  border-radius:50%;transform:translate(-50%,-50%);z-index:4;
  transition:all 0.3s;
}
.poet-dot.highlight{
  width:16px;height:16px;
  box-shadow:0 0 12px rgba(212,168,83,0.6);
}
.pc-name{font-size:18px;font-weight:700;color:var(--gold-light);margin-bottom:4px}
.pc-years{font-size:11px;color:var(--ink3);margin-bottom:8px}
.pc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.poet-card.left .pc-tags{justify-content:flex-end}
.pc-tag{
  padding:2px 10px;border-radius:10px;font-size:11px;
  border:1px solid rgba(255,255,255,0.1);color:var(--ink2);
}
.pc-tag.school{border-color:rgba(192,57,43,0.3);color:#e88}
.pc-works{font-size:12px;color:var(--ink2);line-height:1.6}
.pc-works span{
  display:inline-block;padding:2px 8px;margin:2px;
  background:rgba(255,255,255,0.04);border-radius:6px;
  cursor:pointer;transition:all 0.2s;
}
.pc-works span:hover{background:var(--gold-dim);color:var(--gold)}

/* SECTION: poet detail view */
.view{display:none;min-height:100vh}
.view.active{display:block;animation:fadeUp 0.4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.detail-view{padding:0 0 80px}
.detail-hero{
  position:relative;padding:60px 20px 40px;text-align:center;
  background:linear-gradient(180deg,rgba(212,168,83,0.08) 0%,transparent 100%);
}
.detail-back{
  position:absolute;top:20px;left:20px;padding:8px 18px;
  border-radius:20px;border:1px solid rgba(255,255,255,0.1);
  background:rgba(0,0,0,0.3);color:var(--ink2);cursor:pointer;
  font-size:13px;transition:all 0.2s;backdrop-filter:blur(10px);
}
.detail-back:hover{border-color:var(--gold);color:var(--gold)}
.detail-name{font-size:clamp(28px,5vw,42px);font-weight:900;color:var(--gold-light);margin-bottom:4px}
.detail-years{font-size:14px;color:var(--ink3);margin-bottom:16px}
.detail-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.detail-tag{
  padding:4px 16px;border-radius:20px;font-size:12px;
  border:1px solid rgba(255,255,255,0.1);color:var(--ink2);
}
.detail-tag.dynasty{border-color:var(--gold-dim);color:var(--gold)}
.detail-tag.school{border-color:rgba(192,57,43,0.3);color:#e88}

.detail-content{max-width:800px;margin:0 auto;padding:0 20px}
.detail-section{margin-bottom:40px}
.detail-section h3{
  font-size:18px;color:var(--gold);margin-bottom:16px;
  padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.06);
}
.detail-bio{font-size:15px;line-height:2;color:var(--ink)}
/* life trajectory */
.trajectory{display:flex;flex-direction:column;gap:16px;padding-left:20px;border-left:2px solid var(--gold-dim)}
.trajectory-item{
  position:relative;padding:12px 16px;
  background:rgba(255,255,255,0.03);border-radius:10px;
}
.trajectory-item::before{
  content:'';position:absolute;left:-25px;top:18px;
  width:10px;height:10px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg);
}
.traj-year{font-size:12px;color:var(--gold);font-weight:600;margin-bottom:4px}
.traj-text{font-size:14px;color:var(--ink2)}

/* poem list */
.poem-list{display:flex;flex-direction:column;gap:12px}
.poem-card{
  padding:20px;background:var(--card);border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius);cursor:pointer;transition:all 0.3s;
}
.poem-card:hover{border-color:var(--gold-dim);transform:translateX(4px)}
.poem-card .poem-title{font-size:16px;font-weight:700;color:var(--gold-light);margin-bottom:6px}
.poem-card .poem-preview{font-size:13px;color:var(--ink2);line-height:1.8}
.poem-card .poem-actions{margin-top:10px;display:flex;gap:8px}
.poem-action-btn{
  padding:4px 14px;border-radius:16px;font-size:11px;
  border:1px solid rgba(255,255,255,0.1);background:none;
  color:var(--ink2);cursor:pointer;transition:all 0.2s;
}
.poem-action-btn:hover{border-color:var(--gold);color:var(--gold)}
.poem-action-btn.added{border-color:var(--green);color:var(--green)}

/* SECTION: poem learning view */
.learn-view{padding:0 0 80px}
.learn-hero{
  position:relative;padding:50px 20px 30px;text-align:center;
  background:linear-gradient(180deg,rgba(192,57,43,0.06) 0%,transparent 100%);
}
.learn-title{font-size:clamp(24px,4vw,36px);font-weight:900;color:var(--gold-light);margin-bottom:4px}
.learn-poet{font-size:14px;color:var(--ink3)}
.learn-content{max-width:720px;margin:0 auto;padding:0 20px}
.learn-poem-text{
  background:var(--card);border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius);padding:32px;text-align:center;
  margin-bottom:24px;
}
.learn-poem-text p{
  font-size:clamp(18px,3vw,24px);line-height:2.2;color:var(--ink);
  font-weight:500;letter-spacing:2px;
}
.learn-section{margin-bottom:32px}
.learn-section h4{
  font-size:15px;color:var(--gold);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.learn-text{font-size:14px;line-height:2;color:var(--ink2)}
.learn-text dt{color:var(--gold-light);font-weight:600;margin-top:10px}
.learn-text dd{margin-left:0;margin-bottom:4px}
.learn-toolbar{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;
}
.toolbar-btn{
  padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;
  border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);
  color:var(--ink);cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;gap:6px;
}
.toolbar-btn:hover{border-color:var(--gold);color:var(--gold)}
.toolbar-btn.primary{background:linear-gradient(135deg,var(--gold),#b8923e);border:none;color:#fff}
.toolbar-btn.primary:hover{opacity:0.9}
.toolbar-btn.added{border-color:var(--green);color:var(--green)}

/* SECTION: study list floating button */
.study-list-btn{
  position:fixed;bottom:24px;right:24px;z-index:100;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),#b8923e);
  border:none;color:#fff;font-size:20px;cursor:pointer;
  box-shadow:0 4px 20px rgba(212,168,83,0.4);
  transition:transform 0.2s;display:flex;align-items:center;justify-content:center;
}
.study-list-btn:hover{transform:scale(1.1)}
.study-list-badge{
  position:absolute;top:-4px;right:-4px;
  background:var(--accent2);color:#fff;font-size:10px;font-weight:700;
  width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}

/* SECTION: study list panel */
.study-panel{
  display:none;position:fixed;right:0;top:0;bottom:0;width:360px;
  background:var(--bg2);border-left:1px solid rgba(255,255,255,0.08);
  z-index:200;padding:24px;overflow-y:auto;
  animation:slideRight 0.3s ease;
}
.study-panel.show{display:block}
@keyframes slideRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
.study-panel-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;
}
.study-panel h3{font-size:18px;color:var(--gold-light)}
.study-panel-close{
  background:none;border:none;color:var(--ink3);font-size:20px;cursor:pointer;
}
.study-item{
  padding:14px;background:var(--card);border-radius:10px;
  margin-bottom:8px;cursor:pointer;transition:all 0.2s;
  display:flex;justify-content:space-between;align-items:center;
}
.study-item:hover{border-color:var(--gold-dim);background:rgba(212,168,83,0.05)}
.study-item-info .si-title{font-weight:600;font-size:14px;color:var(--ink)}
.study-item-info .si-poet{font-size:11px;color:var(--ink3)}
.study-item-remove{
  background:none;border:none;color:var(--ink3);cursor:pointer;font-size:14px;
  transition:color 0.2s;
}
.study-item-remove:hover{color:var(--accent2)}

/* SECTION: responsive */
@media(max-width:768px){
  .poet-card{width:220px;padding:14px}
  .poet-card.left{right:calc(50% + 24px)}
  .poet-card.right{left:calc(50% + 24px)}
  .poet-card.left::after,.poet-card.right::after{display:none}
  .study-panel{width:100%}
  .hero-title{letter-spacing:3px}
}
@media(max-width:480px){
  .poet-card{width:140px;padding:10px;font-size:12px}
  .pc-name{font-size:14px}
  .pc-works{font-size:11px}
  .poet-card.left{right:calc(50% + 16px)}
  .poet-card.right{left:calc(50% + 16px)}
}
</style>
</head>
<body>

<!-- SECTION: main-view -->
<div id="mainView" class="view active">
  <!-- Hero -->
  <div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-particles" id="heroParticles"></div>
    <div class="hero-content">
      <div class="hero-badge">中华诗词 · 跨越千年的对话</div>
      <h1 class="hero-title">诗路五千年</h1>
      <p class="hero-sub">从先秦到清末，穿越时空与伟大诗人相遇</p>
      <div class="hero-search">
        <input type="text" id="searchInput" placeholder="搜索诗人、诗作、朝代…" oninput="onSearch(this.value)" onfocus="onSearch(this.value)">
        <button onclick="onSearch(document.getElementById('searchInput').value)">搜索</button>
      </div>
    </div>
    <div class="hero-scroll" onclick="document.getElementById('timelineSection').scrollIntoView({behavior:'smooth'})">↓ 向下探索</div>
  </div>

  <!-- Search Overlay -->
  <div class="search-overlay" id="searchOverlay">
    <button class="search-close" onclick="closeSearch()">✕</button>
    <div class="search-results" id="searchResults"></div>
  </div>

  <!-- Timeline -->
  <div class="timeline-section" id="timelineSection">
    <div class="timeline-section-title">— 诗 路 长 卷 —</div>
    <div class="timeline-container" id="timelineContainer">
      <div class="timeline-axis"></div>
      <!-- JS renders dynasty labels, grid lines, poet cards, dots -->
    </div>
  </div>
</div>

<!-- SECTION: poet-detail-view -->
<div id="detailView" class="view">
  <div class="detail-view">
    <div class="detail-hero">
      <button class="detail-back" onclick="goBack()">← 返回时间轴</button>
      <div class="detail-name" id="detailName"></div>
      <div class="detail-years" id="detailYears"></div>
      <div class="detail-tags" id="detailTags"></div>
    </div>
    <div class="detail-content">
      <div class="detail-section">
        <h3>📜 生平简介</h3>
        <div class="detail-bio" id="detailBio"></div>
      </div>
      <div class="detail-section">
        <h3>🗺️ 人生轨迹</h3>
        <div class="trajectory" id="detailTrajectory"></div>
      </div>
      <div class="detail-section">
        <h3>📖 代表诗作</h3>
        <div class="poem-list" id="detailPoems"></div>
      </div>
    </div>
  </div>
</div>

<!-- SECTION: poem-learning-view -->
<div id="learnView" class="view">
  <div class="learn-view">
    <div class="learn-hero">
      <button class="detail-back" onclick="goBackToPoet()">← 返回诗人</button>
      <div class="learn-title" id="learnTitle"></div>
      <div class="learn-poet" id="learnPoet"></div>
    </div>
    <div class="learn-content">
      <div class="learn-toolbar">
        <button class="toolbar-btn primary" onclick="readPoem()">🔊 朗读</button>
        <button class="toolbar-btn" id="addStudyBtn" onclick="toggleStudy()">📚 加入学习清单</button>
      </div>
      <div class="learn-poem-text" id="learnPoemText"></div>
      <div class="learn-section">
        <h4>📝 释义与赏析</h4>
        <dl class="learn-text" id="learnNotes"></dl>
      </div>
    </div>
  </div>
</div>

<!-- SECTION: study list -->
<button class="study-list-btn" onclick="toggleStudyPanel()" title="学习清单">
  📚<span class="study-list-badge" id="studyBadge">0</span>
</button>
<div class="study-panel" id="studyPanel">
  <div class="study-panel-header">
    <h3>📚 我的学习清单</h3>
    <button class="study-panel-close" onclick="toggleStudyPanel()">✕</button>
  </div>
  <div id="studyListContent"></div>
</div>

<script>
/* ============================================================
   DATA: Dynasties
   ============================================================ */
const DYNASTIES = [
  { id:'preqin', name:'先秦', start:-1000, end:-221, color:'#8B7355' },
  { id:'han', name:'汉', start:-206, end:220, color:'#B8860B' },
  { id:'weijin', name:'魏晋南北朝', start:220, end:589, color:'#6B8E6B' },
  { id:'sui', name:'隋', start:581, end:618, color:'#8B6914' },
  { id:'tang', name:'唐', start:618, end:907, color:'#C0392B' },
  { id:'wudai', name:'五代', start:907, end:960, color:'#7B68AE' },

    works:[
      {title:'长相思',text:'山一程，水一程，\n身向榆关那畔行，夜深千帐灯。\n风一更，雪一更，\n聒碎乡心梦不成，故园无此声。',
       notes:{释义:'跋山涉水走过一程又一程，向着山海关那边行进，夜深时千百顶帐篷中灯火通明。一夜的风雪交替不停，嘈杂的风雪声搅碎了思乡的梦，家乡可没有这样的声音。',赏析:'这首词写行军途中对故乡的思念，语言朴素而感情真挚。"夜深千帐灯"一句气象宏大，王国维赞其"千古壮观"。'}}
    ],
    bio:'纳兰性德（1655年—1685年），字容若，满洲正黄旗人。清代最著名词人之一，与朱彝尊、陈维崧并称"清词三大家"。王国维赞其"北宋以来，一人而已"。',
    trajectory:[
      {year:'1655年',text:'出生于北京，为权臣明珠之子'},

/* ============================================================
   STATE
   ============================================================ */
let currentPoet = null;
let currentPoem = null;
let studyList = JSON.parse(localStorage.getItem('poetry_study_list') || '[]');
let viewStack = [];

/* ============================================================
   INIT
   ============================================================ */
function init() {
  createHeroParticles();
  renderTimeline();
  updateStudyBadge();
}

function createHeroParticles() {
  const container = document.getElementById('heroParticles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'hero-particle';
    const size = 2 + Math.random() * 4;
    p.style.cssText = `
      width:${size}px;height:${size}px;
      left:${Math.random()*100}%;top:${Math.random()*100}%;
      animation-delay:${Math.random()*8}s;
      animation-duration:${6+Math.random()*6}s;
    `;
    container.appendChild(p);
  }
}

/* ============================================================
   TIMELINE RENDERING
   ============================================================ */
function renderTimeline() {
  const container = document.getElementById('timelineContainer');
  // Keep axis
  const axis = container.querySelector('.timeline-axis');
  container.innerHTML = '';
  container.appendChild(axis);

  // Timeline range
  const yearStart = -1100, yearEnd = 2000;
  const totalYears = yearEnd - yearStart;
  const pxPerYear = 2.2; // pixels per year
  const totalHeight = totalYears * pxPerYear;
  container.style.height = totalHeight + 'px';

  function yearToY(year) {
    return (year - yearStart) * pxPerYear;
  }

  // Dynasty grid lines and labels
  DYNASTIES.forEach(d => {
    const midYear = Math.round((d.start + d.end) / 2);
    const y = yearToY(midYear);

    // Grid line spanning full width
    const line = document.createElement('div');
    line.className = 'dynasty-line';
    line.id = 'dline-' + d.id;
    line.style.top = y + 'px';
    container.appendChild(line);

    // Dynasty label centered on axis
    const label = document.createElement('div');
    label.className = 'dynasty-label';
    label.id = 'dlabel-' + d.id;
    label.style.top = (y - 18) + 'px';
    label.innerHTML = `${d.name}<span class="dynasty-years">${formatYear(d.start)} — ${formatYear(d.end)}</span>`;
    label.addEventListener('mouseenter', () => highlightDynasty(d.id, true));
    label.addEventListener('mouseleave', () => highlightDynasty(d.id, false));
    container.appendChild(label);
  });

  // Poet cards alternating left/right
  const sortedPoets = [...POETS].sort((a, b) => a.birth - b.birth);
  let side = 'left';
  let lastY = -100;

  sortedPoets.forEach((poet, i) => {
    const y = yearToY(poet.birth);
    // Adjust if cards would overlap
    let adjustedY = y;
    if (adjustedY - lastY < 180) adjustedY = lastY + 180;

    // Dot on axis
    const dot = document.createElement('div');
    dot.className = 'poet-dot';
    dot.id = 'dot-' + poet.id;
    dot.dataset.dynasty = poet.dynasty;
    dot.style.top = (adjustedY + 40) + 'px';
    container.appendChild(dot);

    // Card
    const card = document.createElement('div');
    card.className = `poet-card ${side}`;
    card.id = 'card-' + poet.id;
    card.dataset.dynasty = poet.dynasty;
    card.style.top = adjustedY + 'px';
    card.innerHTML = `
      <div class="pc-name">${poet.name}</div>
      <div class="pc-years">${poet.years}</div>
      <div class="pc-tags">
        <span class="pc-tag">${DYNASTIES.find(d=>d.id===poet.dynasty).name}</span>
        <span class="pc-tag school">${poet.school}</span>
      </div>
      <div class="pc-works">${poet.works.slice(0,3).map(w=>`<span onclick="event.stopPropagation();openPoem('${poet.id}','${w.title}')">${w.title}</span>`).join('')}</div>
    `;
    card.addEventListener('click', () => openPoet(poet.id));
    card.addEventListener('mouseenter', () => highlightDynasty(poet.dynasty, true));
    card.addEventListener('mouseleave', () => highlightDynasty(poet.dynasty, false));
    container.appendChild(card);

    lastY = adjustedY;
    side = side === 'left' ? 'right' : 'left';
  });
}

function highlightDynasty(dynastyId, on) {
  const line = document.getElementById('dline-' + dynastyId);
  const label = document.getElementById('dlabel-' + dynastyId);
  if (line) line.classList.toggle('highlight', on);
  if (label) label.classList.toggle('highlight', on);

  document.querySelectorAll('.poet-card').forEach(card => {
    if (card.dataset.dynasty === dynastyId) {
      card.classList.toggle('highlight', on);
    }
  });
  document.querySelectorAll('.poet-dot').forEach(dot => {
    if (dot.dataset.dynasty === dynastyId) {
      dot.classList.toggle('highlight', on);
    }
  });
}

function formatYear(y) {
  if (y < 0) return '前' + Math.abs(y) + '年';
  return y + '年';
}

/* ============================================================
   SEARCH
   ============================================================ */
function onSearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) { closeSearch(); return; }
  const overlay = document.getElementById('searchOverlay');
  const results = document.getElementById('searchResults');

  // Search poets and poems
  let html = '';
  POETS.forEach(poet => {
    const dynastyName = DYNASTIES.find(d=>d.id===poet.dynasty).name;
    const matchPoet = poet.name.includes(q) || poet.zi.includes(q) || poet.school.includes(q) || dynastyName.includes(q);
    const matchWorks = poet.works.filter(w => w.title.includes(q) || w.text.includes(q));

    if (matchPoet) {
      html += `<div class="search-result-item" onclick="closeSearch();openPoet('${poet.id}')">
        <span class="sr-emoji">👤</span>
        <div><div class="sr-name">${poet.name}</div><div class="sr-meta">${dynastyName} · ${poet.school} · ${poet.years}</div></div>
      </div>`;
    }
    matchWorks.forEach(w => {
      html += `<div class="search-result-item" onclick="closeSearch();openPoem('${poet.id}','${w.title}')">
        <span class="sr-emoji">📜</span>
        <div><div class="sr-name">${w.title}</div><div class="sr-meta">${poet.name} · ${dynastyName}</div></div>
      </div>`;
    });
  });

  if (!html) html = '<div style="padding:30px;text-align:center;color:var(--ink3)">未找到相关结果</div>';
  results.innerHTML = html;
  overlay.classList.add('show');
}
function closeSearch() {
  document.getElementById('searchOverlay').classList.remove('show');
}

/* ============================================================
   VIEW NAVIGATION
   ============================================================ */
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goBack() {
  viewStack.pop();
  const prev = viewStack[viewStack.length - 1] || 'mainView';
  showView(prev);
}
function goBackToPoet() {
  viewStack.pop();
  showView('detailView');
}

/* ============================================================
   POET DETAIL
   ============================================================ */
function openPoet(id) {
  const poet = POETS.find(p => p.id === id);
  if (!poet) return;
  currentPoet = poet;
  viewStack = ['mainView', 'detailView'];

  const dynasty = DYNASTIES.find(d => d.id === poet.dynasty);
  document.getElementById('detailName').textContent = poet.name;
  document.getElementById('detailYears').textContent = poet.years;
  document.getElementById('detailTags').innerHTML = `
    <span class="detail-tag dynasty">${dynasty.name}</span>
    <span class="detail-tag">${poet.zi}</span>
    <span class="detail-tag school">${poet.school}</span>
  `;
  document.getElementById('detailBio').textContent = poet.bio;

  // Trajectory
  document.getElementById('detailTrajectory').innerHTML = poet.trajectory.map(t => `
    <div class="trajectory-item">
      <div class="traj-year">${t.year}</div>
      <div class="traj-text">${t.text}</div>
    </div>
  `).join('');

  // Poems
  document.getElementById('detailPoems').innerHTML = poet.works.map(w => {
    const inList = studyList.some(s => s.poetId === poet.id && s.title === w.title);
    return `<div class="poem-card" onclick="openPoem('${poet.id}','${w.title}')">
      <div class="poem-title">${w.title}</div>
      <div class="poem-preview">${w.text.split('\n').slice(0,2).join(' / ')}…</div>
      <div class="poem-actions">
        <button class="poem-action-btn ${inList?'added':''}" onclick="event.stopPropagation();quickToggleStudy('${poet.id}','${w.title}',this)">
          ${inList?'✓ 已收藏':'+ 收藏'}
        </button>
      </div>
    </div>`;
  }).join('');

  showView('detailView');
}

/* ============================================================
   POEM LEARNING
   ============================================================ */
function openPoem(poetId, title) {
  const poet = POETS.find(p => p.id === poetId);
  if (!poet) return;
  const poem = poet.works.find(w => w.title === title);
  if (!poem) return;
  currentPoet = poet;
  currentPoem = poem;

  if (!viewStack.includes('learnView')) {
    viewStack.push('learnView');
  }

  document.getElementById('learnTitle').textContent = poem.title;
  const dynasty = DYNASTIES.find(d => d.id === poet.dynasty);
  document.getElementById('learnPoet').textContent = `${poet.name} · ${dynasty.name}`;

  // Poem text
  document.getElementById('learnPoemText').innerHTML = poem.text.split('\n').map(line => `<p>${line}</p>`).join('');

  // Notes
  let notesHtml = '';
  if (poem.notes) {
    if (poem.notes.释义) notesHtml += `<dt>释义</dt><dd>${poem.notes.释义}</dd>`;
    if (poem.notes.赏析) notesHtml += `<dt>赏析</dt><dd>${poem.notes.赏析}</dd>`;
  }
  document.getElementById('learnNotes').innerHTML = notesHtml;

  // Study button state
  updateStudyBtn();
  showView('learnView');
}

function readPoem() {
  if (!currentPoem) return;
  // Use Web Speech API for reading
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(currentPoem.text.replace(/\n/g, '，'));
    utterance.lang = 'zh-CN';
    utterance.rate = 0.8;
    utterance.pitch = 1;
    // Try to find a Chinese voice
    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang.startsWith('zh'));
    if (zhVoice) utterance.voice = zhVoice;
    window.speechSynthesis.speak(utterance);
  } else {
    alert('您的浏览器不支持语音朗读功能');
  }
}

/* ============================================================
   STUDY LIST
   ============================================================ */
function toggleStudy() {
  if (!currentPoet || !currentPoem) return;
  const idx = studyList.findIndex(s => s.poetId === currentPoet.id && s.title === currentPoem.title);
  if (idx >= 0) {
    studyList.splice(idx, 1);
  } else {
    studyList.push({
      poetId: currentPoet.id,
      poetName: currentPoet.name,
      title: currentPoem.title,
      dynasty: DYNASTIES.find(d => d.id === currentPoet.dynasty).name,
      addedAt: Date.now()
    });
  }
  saveStudyList();
  updateStudyBtn();
  updateStudyBadge();
}

function quickToggleStudy(poetId, title, btn) {
  const poet = POETS.find(p => p.id === poetId);
  const idx = studyList.findIndex(s => s.poetId === poetId && s.title === title);
  if (idx >= 0) {
    studyList.splice(idx, 1);
    btn.classList.remove('added');
    btn.textContent = '+ 收藏';
  } else {
    studyList.push({
      poetId, poetName: poet.name, title,
      dynasty: DYNASTIES.find(d => d.id === poet.dynasty).name,
      addedAt: Date.now()
    });
    btn.classList.add('added');
    btn.textContent = '✓ 已收藏';
  }
  saveStudyList();
  updateStudyBadge();
}

function updateStudyBtn() {
  if (!currentPoet || !currentPoem) return;
  const btn = document.getElementById('addStudyBtn');
  const inList = studyList.some(s => s.poetId === currentPoet.id && s.title === currentPoem.title);
  btn.className = 'toolbar-btn' + (inList ? ' added' : '');
  btn.textContent = inList ? '✓ 已在学习清单' : '📚 加入学习清单';
}

function saveStudyList() {
  localStorage.setItem('poetry_study_list', JSON.stringify(studyList));
}

function updateStudyBadge() {
  document.getElementById('studyBadge').textContent = studyList.length;
}

function toggleStudyPanel() {
  const panel = document.getElementById('studyPanel');
  panel.classList.toggle('show');
  if (panel.classList.contains('show')) renderStudyPanel();
}

function renderStudyPanel() {
  const content = document.getElementById('studyListContent');
  if (studyList.length === 0) {
    content.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--ink3);font-size:13px">还没有收藏的古诗<br>浏览诗人详情时点击"收藏"即可添加</div>';
    return;
  }
  content.innerHTML = studyList.map((item, i) => `
    <div class="study-item" onclick="openPoem('${item.poetId}','${item.title}')">
      <div class="study-item-info">
        <div class="si-title">${item.title}</div>
        <div class="si-poet">${item.poetName} · ${item.dynasty}</div>
      </div>
      <button class="study-item-remove" onclick="event.stopPropagation();removeStudyItem(${i})" title="移除">✕</button>
    </div>
  `).join('');
}

function removeStudyItem(index) {
  studyList.splice(index, 1);
  saveStudyList();
  updateStudyBadge();
  renderStudyPanel();
}

/* ============================================================
   UTILITY
   ============================================================ */
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ============================================================
   BOOT
   ============================================================ */
init();
// Ensure speech synthesis voices are loaded
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
</script>
